site_name: YuanTest Playwright
site_description: Playwright test orchestrator, executor and reporter with web UI
site_url: https://yuantest-playwright.readthedocs.io/
repo_url: https://github.com/yuandiv/yuantest-playwright
repo_name: yuandiv/yuantest-playwright
edit_uri: edit/main/documentation/

theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 使用指南:
    - 概述: usage/index.md
    - Web UI: usage/web-ui.md
    - 命令行: usage/cli.md
    - CI/CD 集成: usage/cicd.md
  - API 参考:
    - 概述: api/index.md
    - Orchestrator: api/orchestrator.md
    - Executor: api/executor.md
    - Reporter: api/reporter.md
    - FlakyTestManager: api/flaky.md
    - DashboardServer: api/dashboard.md
  - CLI 命令: cli.md
  - 配置: configuration.md
  - 更新日志: changelog.md
  - 贡献指南: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search:
      lang:
        - zh
        - en
  - include-markdown

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuandiv/yuantest-playwright
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@yuantest/playwright
  alternate:
    - name: 中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en

extra_css:
  - stylesheets/extra.css
