site_name: YuanTest Playwright
site_description: Playwright test orchestrator, executor and reporter with web UI
site_url: https://yuantest-playwright.readthedocs.io/
repo_url: https://github.com/yuandiv/yuantest-playwright
repo_name: yuandiv/yuantest-playwright
edit_uri: edit/main/documentation/
docs_dir: documentation

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Usage:
      - Overview: usage/index.md
      - Web UI: usage/web-ui.md
      - CLI: usage/cli.md
      - CI/CD Integration: usage/cicd.md
  - Guides:
      - Flaky Test Management: guides/flaky-management.md
      - AI Diagnosis: guides/ai-diagnosis.md
      - Agent System: guides/agent-system.md
  - API Reference:
      - Overview: api/index.md
      - Orchestrator: api/orchestrator.md
      - Executor: api/executor.md
      - Reporter: api/reporter.md
      - FlakyTestManager: api/flaky.md
      - DashboardServer: api/dashboard.md
      - UnifiedAIService: api/ai-service.md
      - AgentService: api/agent.md
      - ChatService: api/chat.md
      - RealtimeReporter: api/realtime.md
      - TraceManager: api/trace.md
      - AnnotationManager: api/annotations.md
      - TagManager: api/tags.md
      - ArtifactManager: api/artifacts.md
      - VisualTestingManager: api/visual.md
      - TestDiscovery: api/discovery.md
      - ServiceContainer: api/container.md
      - Storage: api/storage.md
      - Cache: api/cache.md
      - Logger: api/logger.md
  - CLI Commands: cli.md
  - Configuration: configuration.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search:
      lang:
        - en
        - zh
  - include-markdown
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 中文
          nav_translations:
            Home: 首页
            Getting Started: 快速开始
            Architecture: 架构概览
            Usage: 使用指南
            Guides: 深度指南
            API Reference: API 参考
            CLI Commands: CLI 命令
            Configuration: 配置
            Changelog: 更新日志
            Contributing: 贡献指南
            Overview: 概述
            Web UI: Web UI
            CLI: 命令行
            CI/CD Integration: CI/CD 集成
            Flaky Test Management: Flaky 测试管理
            AI Diagnosis: AI 智能诊断

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuandiv/yuantest-playwright
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/yuantest-playwright

extra_css:
  - stylesheets/extra.css
